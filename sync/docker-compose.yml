name: jianji-sync

services:
  app:
    image: ${IMAGE_REPO:-jianji-sync-app}:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    environment:
      - SYNC_KEY=${SYNC_KEY}
      - READ_KEY=${READ_KEY}
      - DATABASE_URL=postgres://jianji:${POSTGRES_PASSWORD}@db:5432/jianji
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"   # 只绑本机，由 Nginx 反代暴露 HTTPS

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=jianji
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=jianji
    volumes:
      - jianji-sync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianji -d jianji"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jianji-sync-pgdata:
    name: jianji-sync-pgdata
