org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 项目路径含中文（Windows 下 AGP 默认拒绝），本机构建需显式放行
android.overridePathCheck=true

# ---- 发布版本号兜底值（正式出包由 scripts/release.ps1 计算并用 -P 传入，不再手工维护）----
# versionName = releaseVersionDate + "." + releaseVersionSeq（如 2026.11.05.1）
# versionCode = YYYYMMDD * 100 + releaseVersionSeq（如 2026110501）
# 仅在直接运行 gradlew（未传 -PjianjiVersionName/-PjianjiVersionCode）时生效。
releaseVersionDate=2026.11.09
releaseVersionSeq=1
