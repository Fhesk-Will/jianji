org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 项目路径含中文（Windows 下 AGP 默认拒绝），本机构建需显式放行
android.overridePathCheck=true

# ---- 发布版本号单一来源（发版时只改这两行）----
# versionName = releaseVersionDate + "." + releaseVersionSeq（如 2026.11.05.1）
# versionCode = YYYYMMDD * 100 + releaseVersionSeq（如 2026110501）
# 同日多版：保持日期不变，releaseVersionSeq 依次 1、2、3…；跨日回到 1。
releaseVersionDate=2026.11.08
releaseVersionSeq=2
